spring.datasource.url=jdbc:h2:file:./data/cinema-reservation;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console logging
logging.level.root=INFO
logging.level.com.cinema.reservation=INFO
# Uncomment for troubleshooting (per-request seat availability, sweep scans, view rendering):
#logging.level.com.cinema.reservation=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
